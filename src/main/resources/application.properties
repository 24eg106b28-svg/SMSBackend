server.port=8080

# ---- MySQL (change username / password to match your MySQL) ----
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- JWT (secret must be at least 32 characters) ----
app.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandom_StudentManagementSystem_2026
app.jwt.expiration-ms=86400000
